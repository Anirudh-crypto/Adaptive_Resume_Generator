# STAGE 2: the merge commit is verified, deployed to a hidden candidate revision, and only
# promoted to production after an explicit human approval.
#
# Why the tests run again here, when Stage 1 already ran them: the merge commit is a commit that
# nothing has ever tested. Stage 1 checks a branch head; if two independently-green PRs merge,
# the resulting tree can be broken by a semantic conflict neither branch could see. This is the
# first and only run against the code that will actually ship.
#
# Why the approval gates the traffic cutover rather than the deploy: by the time the approval
# issue appears, the new revision is already running on real Cloud Run infrastructure and has
# passed its checks there. Approving flips traffic to an instance known to work, and rolling back
# is a single instant command with no rebuild:
#
#   gcloud run services update-traffic resume-builder --region us-central1 \
#     --to-revisions <PREVIOUS_REVISION>=100
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything (tests, build, push, candidate deploy, approval) but do NOT shift production traffic"
        type: boolean
        default: false

# Never cancel a deploy in flight, and never let two of them race the same Cloud Run service.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: resume-builder-503517
  REGION: us-central1
  REPO: resume-builder
  SERVICE: resume-builder
  DEPLOYER_SA: github-deployer@resume-builder-503517.iam.gserviceaccount.com
  RUNTIME_SA: resume-builder-runtime@resume-builder-503517.iam.gserviceaccount.com

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token for Workload Identity Federation
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Build once, locally, and smoke test that exact image before it is pushed anywhere.
      # Pulling the image back out of Artifact Registry in order to test it would be billed as
      # GCP internet egress -- the only genuinely non-free operation available in this pipeline.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/resume-builder:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Start container
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e PORT=8080 \
            -e GEMINI_API_KEY=ci-dummy \
            -e SUPABASE_URL=https://ci-dummy.supabase.co \
            -e SUPABASE_ANON_KEY=ci-dummy \
            -e SUPABASE_SERVICE_ROLE_KEY=ci-dummy \
            local/resume-builder:${{ github.sha }}

      - name: Smoke test the image
        run: bash .github/scripts/smoke.sh http://localhost:8080

      - name: Container logs
        if: failure()
        run: docker logs smoke || true

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: access_token # docker/login-action needs a bearer token

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Tag and push the same image object that just passed the smoke test, then read its digest
      # back from the local daemon rather than from the registry: no extra round trip, and the
      # deploy pins an immutable reference so a moving tag cannot substitute different bytes.
      - name: Push
        id: push
        run: |
          base="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/app"
          docker tag "local/resume-builder:${GITHUB_SHA}" "${base}:${GITHUB_SHA}"
          docker push "${base}:${GITHUB_SHA}"
          image=$(docker image inspect "${base}:${GITHUB_SHA}" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep "^${base}@" | head -n1)
          test -n "${image}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Pushed \`${image}\`" >> "$GITHUB_STEP_SUMMARY"

  candidate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      previous_revision: ${{ steps.previous.outputs.revision }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      # Captured before anything changes, so the approval issue can name the exact revision to
      # roll back to. Reading it afterwards would return the revision we just created.
      - name: Record the currently-serving revision
        id: previous
        run: |
          revision=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "Currently serving: ${revision:-<none>}"

      # --no-traffic + --tag candidate gives a revision on a private URL that no real user can
      # reach, so it can be tested on production infrastructure with zero user impact.
      #
      # --no-cpu-throttling is load-bearing, not decoration: POST /generate returns 202 and
      # finishes on a background thread, which a throttled instance freezes mid-pipeline. Jobs
      # then hang at whatever stage they reached, silently.
      #
      # --allow-unauthenticated is deliberately absent: it calls run.services.setIamPolicy, which
      # roles/run.developer does not grant. The allUsers invoker binding is applied once during
      # setup and persists across every later revision, tag URLs included.
      - name: Deploy candidate revision
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --image "${{ needs.build.outputs.image }}" \
            --region "$REGION" --project "$PROJECT_ID" \
            --service-account "$RUNTIME_SA" \
            --no-traffic --tag candidate \
            --no-cpu-throttling \
            --min-instances=0 --max-instances=2 --memory=512Mi --cpu=1 \
            --set-env-vars "SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }},GEMINI_MODEL=${{ vars.GEMINI_MODEL }},GENERATION_LIMIT=${{ vars.GENERATION_LIMIT }},GENERATION_WINDOW_HOURS=${{ vars.GENERATION_WINDOW_HOURS }},PHOTO_BUCKET=${{ vars.PHOTO_BUCKET }},PDF_BUCKET=${{ vars.PDF_BUCKET }}" \
            --set-secrets "GEMINI_API_KEY=gemini-api-key:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest" \
            --quiet

          url=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" --format=json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(t['url'] for t in d['status']['traffic'] if t.get('tag')=='candidate'))")
          test -n "${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Candidate revision: ${url}" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # The same script that tested the container on the runner, now against real Cloud Run:
      # real cold start, real Secret Manager injection, real Supabase connectivity.
      #
      # Read-only by construction. This revision talks to the production Supabase project, so a
      # write here would pollute live data -- that is what the in-memory integration fakes exist
      # for.
      - name: Smoke test the candidate revision
        run: bash .github/scripts/smoke.sh "${{ needs.candidate.outputs.url }}"

  report:
    needs: [test, build, candidate, verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-reports
          path: reports/

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - id: sum
        run: python .github/scripts/junit_summary.py "reports/junit-*.xml"

      - id: state
        run: |
          if [ "${{ needs.test.result }}" = "success" ] \
          && [ "${{ needs.build.result }}" = "success" ] \
          && [ "${{ needs.candidate.result }}" = "success" ] \
          && [ "${{ needs.verify.result }}" = "success" ]; then
            echo "value=READY TO PROMOTE" >> "$GITHUB_OUTPUT"
          else
            echo "value=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: Email the result
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: resume-builder CI <${{ secrets.SMTP_USERNAME }}>
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: "[${{ steps.state.outputs.value }}] deploy main @ ${{ github.sha }}"
          html_body: |
            <h2>Stage 2 &mdash; ${{ steps.state.outputs.value }}</h2>
            <p>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Run #${{ github.run_number }}</a>
              &middot; ${{ github.event_name }} by ${{ github.actor }}
              &middot; commit <code>${{ github.sha }}</code>
            </p>
            <ul>
              <li>tests on the merge commit: <b>${{ needs.test.result }}</b> &mdash; ${{ steps.sum.outputs.summary }}</li>
              <li>image build + local smoke test: <b>${{ needs.build.result }}</b></li>
              <li>candidate revision deployed: <b>${{ needs.candidate.result }}</b></li>
              <li>checks against real Cloud Run: <b>${{ needs.verify.result }}</b></li>
            </ul>
            <p>Failed tests: <code>${{ steps.sum.outputs.failed }}</code></p>
            <p>Image: <code>${{ needs.build.outputs.image }}</code></p>
            <p>Candidate URL (serving no production traffic): <a href="${{ needs.candidate.outputs.url }}">${{ needs.candidate.outputs.url }}</a></p>
            <p>
              <b>Production is still on the previous revision.</b> To go live, comment
              <code>approve</code> on the approval issue this run opened. To abandon it, comment
              <code>deny</code> &mdash; nothing needs undoing, since traffic never moved.
            </p>

  approve:
    needs: [build, candidate, verify]
    runs-on: ubuntu-latest
    # GitHub hard-kills any job at 360 minutes, so an approval arriving later than ~5.5h fails
    # the run. Harmless: the candidate revision is already deployed and healthy, so just re-run
    # the workflow or promote by hand.
    timeout-minutes: 330
    permissions:
      issues: write
    steps:
      # Pinned to a commit SHA, not a tag: this action is handed a token with issues: write.
      - uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1
        with:
          secret: ${{ github.token }}
          approvers: ${{ vars.APPROVERS }}
          minimum-approvals: 1
          issue-title: "Promote ${{ github.sha }} to production"
          issue-body: |
            Stage 2 finished. A candidate revision is live on Cloud Run and serving **no**
            production traffic.

            - Image: `${{ needs.build.outputs.image }}`
            - Candidate URL: ${{ needs.candidate.outputs.url }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Current production revision: `${{ needs.candidate.outputs.previous_revision }}`

            Click the candidate URL and try it yourself if you want. When you're satisfied,
            comment **approve** (or `lgtm` / `yes`) to shift 100% of traffic to it. Comment
            **deny** (or `no`) to abort -- nothing needs undoing, because traffic never moved.

            If you approve and then regret it, roll back instantly with:

            ```
            gcloud run services update-traffic ${{ env.SERVICE }} \
              --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
              --to-revisions ${{ needs.candidate.outputs.previous_revision }}=100
            ```

            This repository is public, so anyone can comment here -- the action ignores everyone
            not in the approvers list.
          exclude-workflow-initiator-as-approver: false

  promote:
    needs: [build, candidate, approve]
    # On a `push` event github.event.inputs is null, so this correctly evaluates to true; only an
    # explicit workflow_dispatch with dry_run checked skips the cutover.
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      # The actual production cutover. Nothing is built or deployed here -- the revision has been
      # running and passing checks since the candidate job.
      - name: Shift traffic to the candidate
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --to-latest --quiet

      - name: Verify production
        run: |
          url=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          echo "Production URL: ${url}" >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/smoke.sh "${url}"

      # Never allowed to fail the run: the deploy has already succeeded at this point, and the
      # server-side Artifact Registry cleanup policy is the primary mechanism anyway.
      - name: Prune Artifact Registry
        continue-on-error: true
        run: |
          bash .github/scripts/prune_ar.sh \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/app" \
            "${{ needs.build.outputs.image }}"

      - name: Summarise
        run: |
          {
            echo "## Promoted to production"
            echo ""
            echo "- image: \`${{ needs.build.outputs.image }}\`"
            echo "- previous revision: \`${{ needs.candidate.outputs.previous_revision }}\`"
            echo ""
            echo "Roll back with:"
            echo ""
            echo '```'
            echo "gcloud run services update-traffic $SERVICE --region $REGION --project $PROJECT_ID --to-revisions ${{ needs.candidate.outputs.previous_revision }}=100"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
